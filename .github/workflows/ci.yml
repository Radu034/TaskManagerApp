name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  API_PROJECT: 'src/TaskManagerApp.API/TaskManagerApp.API.csproj'
  TEST_PROJECT: 'tests/TaskManagerApp.Tests/TaskManagerApp.Tests.csproj'
  PUBLISH_OUTPUT: './publish'
  DEPLOY_DIR: './deployed'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

  static-analysis:
    name: Static Code Analysis (Roslyn)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run Roslyn Analyzers
      run: |
        dotnet build ${{ env.API_PROJECT }} \
          --configuration Release \
          /p:AnalysisMode=All \
          /p:EnforceCodeStyleInBuild=true \
          2>&1 | tee analysis-report.txt
        echo "## Static Analysis Report" >> $GITHUB_STEP_SUMMARY
        grep -E "warning|error" analysis-report.txt >> $GITHUB_STEP_SUMMARY || echo "No issues found" >> $GITHUB_STEP_SUMMARY

    - name: Upload Analysis Report
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-report
        path: analysis-report.txt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run Tests with Coverage
      run: |
        dotnet test ${{ env.TEST_PROJECT }} \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults/

  deploy:
    name: Deploy (Publish + Copy Artifacts)
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore & Build
      run: dotnet restore && dotnet build --configuration Release --no-restore

    - name: Publish Application
      run: |
        dotnet publish ${{ env.API_PROJECT }} \
          --configuration Release \
          --output ${{ env.PUBLISH_OUTPUT }} \
          --no-restore

    - name: Deployment Step – Copy to Deploy Directory
      run: |
        mkdir -p ${{ env.DEPLOY_DIR }}
        cp -r ${{ env.PUBLISH_OUTPUT }}/* ${{ env.DEPLOY_DIR }}/
        echo "Deployed at $(date)" > ${{ env.DEPLOY_DIR }}/deployment.log
        echo "Commit: ${{ github.sha }}" >> ${{ env.DEPLOY_DIR }}/deployment.log
        ls -la ${{ env.DEPLOY_DIR }}/

    - name: Upload Deployment Package
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: ${{ env.DEPLOY_DIR }}/
        retention-days: 30

    - name: Deployment Summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
